<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Titkos Labda Projekt v1.4</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #2c3e50;
            font-family: 'Segoe UI', sans-serif;
        }

        canvas { display: block; background-color: #34495e; cursor: crosshair; }

        /* --- UI Overlay --- */
        #ui-overlay {
            position: absolute; top: 20px; left: 20px;
            pointer-events: none; background-color: rgba(0, 0, 0, 0.7);
            padding: 15px; border-radius: 10px; border-left: 5px solid #e74c3c;
            color: #ecf0f1; z-index: 10;
        }

        /* --- Elrejthető Telepítő Panel --- */
        #install-panel {
            position: fixed; right: 0; top: 50%;
            transform: translateY(-50%) translateX(100%); /* Alapból rejtve jobbra */
            display: none; /* Csak ha telepíthető, akkor mutatjuk */
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        #install-panel.visible { display: flex; transform: translateY(-50%) translateX(0); }
        #install-panel.collapsed { transform: translateY(-50%) translateX(calc(100% - 40px)); }

        #install-content {
            background-color: #e74c3c; color: white;
            padding: 15px; border-radius: 15px 0 0 15px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; align-items: center;
        }

        #toggle-btn {
            background-color: #c0392b; color: white;
            border: none; width: 40px; height: 60px;
            border-radius: 10px 0 0 10px; cursor: pointer;
            font-weight: bold; font-size: 1.2rem;
        }

        #install-btn {
            background-color: white; color: #e74c3c;
            border: none; padding: 10px 20px; border-radius: 20px;
            font-weight: bold; cursor: pointer; margin-top: 10px;
            text-transform: uppercase; font-size: 0.8rem;
        }

        #fs-button {
            position: fixed; bottom: 20px; right: 20px;
            background-color: rgba(0,0,0,0.5); color: white;
            border: 1px solid #95a5a6; padding: 8px; border-radius: 5px;
            cursor: pointer; z-index: 100; font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div style="font-weight: bold; color: #e74c3c;">🔒 PROJEKT v1.4</div>
        <div style="font-size: 0.7rem; color: #95a5a6;">Mód: Intelligens PWA</div>
    </div>

    <div id="install-panel">
        <button id="toggle-btn" onclick="togglePanel()">‹</button>
        <div id="install-content">
            <span style="font-size: 0.8rem; font-weight: bold;">APP TELEPÍTÉSE</span>
            <button id="install-btn">MEHET!</button>
        </div>
    </div>

    <button id="fs-button" onclick="toggleFullScreen()">TELJES KÉPERNYŐ</button>
    <canvas id="simCanvas"></canvas>

    <script>
        // --- Service Worker Regisztráció ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW sikeresen regisztrálva'))
                    .catch(err => console.log('SW hiba:', err));
            });
        }

        // --- PWA Telepítési Logika ---
        let deferredPrompt;
        const installPanel = document.getElementById('install-panel');
        const installBtn = document.getElementById('install-btn');
        const toggleBtn = document.getElementById('toggle-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Megállítjuk az automatikus böngésző ablakot
            e.preventDefault();
            deferredPrompt = e;
            // Megmutatjuk a saját panelünket
            installPanel.classList.add('visible');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installPanel.classList.remove('visible');
                }
                deferredPrompt = null;
            }
        });

        function togglePanel() {
            installPanel.classList.toggle('collapsed');
            toggleBtn.innerText = installPanel.classList.contains('collapsed') ? '›' : '‹';
        }

        // --- Fizika és Canvas (Változatlan v1.2 motor) ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const config = { gravity: 0.65, friction: 0.982, bounce: 0.78, kickForce: 32, ballRadius: 40 };
        let ball = { x: 100, y: 100, vx: 10, vy: 0, radius: config.ballRadius, color: '#e74c3c', isGlowing: false };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function update() {
            ball.vy += config.gravity;
            ball.vx *= config.friction; ball.vy *= config.friction;
            ball.x += ball.vx; ball.y += ball.vy;

            if (ball.y + ball.radius > canvas.height) { ball.y = canvas.height - ball.radius; ball.vy *= -config.bounce; }
            if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy *= -config.bounce; }
            if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.vx *= -config.bounce; }
            if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -config.bounce; }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.isGlowing ? '#f1c40f' : '#e74c3c';
            ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = '#ecf0f1'; ctx.stroke();
            ctx.closePath();
        }

        function handleInput(clientX, clientY) {
            const dx = clientX - ball.x; const dy = clientY - ball.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < ball.radius) {
                const angle = Math.atan2(dy, dx);
                ball.vx = -Math.cos(angle) * config.kickForce;
                ball.vy = -Math.sin(angle) * config.kickForce;
                ball.isGlowing = true; setTimeout(() => ball.isGlowing = false, 150);
            }
        }

        canvas.addEventListener('mousedown', (e) => handleInput(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            handleInput(e.touches[0].clientX, e.touches[0].clientY);
            e.preventDefault();
        }, { passive: false });

        update();
    </script>
</body>
</html>
