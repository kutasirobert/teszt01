<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Titkos Labda Projekt v1.6 - Secure Generator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #1a252f;
            font-family: 'Segoe UI', sans-serif;
        }

        canvas { display: block; background-color: #2c3e50; cursor: crosshair; }

        /* --- UI Overlay --- */
        #ui-overlay {
            position: absolute; top: 20px; left: 20px;
            pointer-events: none; background-color: rgba(0, 0, 0, 0.7);
            padding: 15px; border-radius: 10px; border-left: 5px solid #e74c3c;
            color: #ecf0f1; z-index: 10;
        }

        /* --- Teljes képernyő gomb (FELÜL) --- */
        #fs-button {
            position: fixed; top: 20px; right: 20px;
            background-color: rgba(231, 76, 60, 0.6); color: white;
            border: 1px solid #e74c3c; padding: 10px 15px; border-radius: 5px;
            cursor: pointer; z-index: 100; font-size: 0.8rem;
            transition: all 0.3s;
        }
        #fs-button:hover { background-color: rgba(231, 76, 60, 1); }

        /* --- Aktiváló képernyő (The Shield) --- */
        #activation-shield {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a252f; display: flex;
            justify-content: center; align-items: center; z-index: 2000;
        }

        #activation-box {
            background-color: #2c3e50; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
            border: 1px solid #e74c3c; width: 80%; max-width: 400px;
        }

        #activation-box h2 { color: #e74c3c; margin-top: 0; }
        
        #device-id-display {
            font-family: monospace; font-size: 0.8rem; color: #95a5a6;
            background: #1a252f; padding: 8px; border-radius: 5px;
            margin-bottom: 20px; display: block; border: 1px dashed #34495e;
        }

        input[type="text"] {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: #ecf0f1; color: #2c3e50; font-weight: bold;
            font-size: 1.1rem; text-align: center; box-sizing: border-box;
            margin-bottom: 15px; text-transform: uppercase;
        }

        #unlock-btn {
            width: 100%; padding: 12px; background: #e74c3c; color: white;
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer;
            text-transform: uppercase;
        }
        #unlock-btn:active { transform: scale(0.98); }

        /* Telepítő Panel */
        #install-panel {
            position: fixed; right: 0; top: 50%;
            transform: translateY(-50%) translateX(100%);
            display: none; align-items: center; z-index: 1000;
            transition: transform 0.4s;
        }
        #install-panel.visible { display: flex; transform: translateY(-50%) translateX(0); }
        #install-panel.collapsed { transform: translateY(-50%) translateX(calc(100% - 40px)); }
        #install-content { background: #e74c3c; color: white; padding: 15px; border-radius: 15px 0 0 15px; }
        #toggle-btn { background: #c0392b; color: white; border: none; width: 40px; height: 60px; border-radius: 10px 0 0 10px; }
    </style>
</head>
<body>

    <div id="activation-shield">
        <div id="activation-box">
            <h2>🔒 RENDSZERZÁR</h2>
            <p style="color: #ecf0f1; font-size: 0.9rem;">Add meg a termékkódot az aktiváláshoz!</p>
            <span id="device-id-display">ID: Generálás...</span>
            <input type="text" id="activation-input" placeholder="LABDA-XXXXXX" maxlength="20">
            <button id="unlock-btn" onclick="checkCode()">Aktiválás</button>
            <p id="error-msg" style="color: #e74c3c; font-size: 0.8rem; margin-top: 10px; display: none;">Érvénytelen kód! Ellenőrizd az ID-t.</p>
        </div>
    </div>

    <div id="ui-overlay">
        <div style="font-weight: bold; color: #e74c3c;">🔒 PROJEKT v1.6</div>
        <div id="status-text" style="font-size: 0.7rem; color: #95a5a6;">Status: Verifying...</div>
    </div>

    <button id="fs-button" onclick="toggleFullScreen()">TELJES KÉPERNYŐ</button>

    <div id="install-panel">
        <button id="toggle-btn" onclick="togglePanel()">‹</button>
        <div id="install-content">
            <span style="font-size: 0.7rem; font-weight: bold;">PWA APP</span><br>
            <button onclick="pwaInstall()" style="margin-top:5px; font-size:0.7rem;">TELEPÍTÉS</button>
        </div>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        // --- 1. KRIPTO AKTIVÁLÁS ---
        // "Rejtett" Salt: TITKOS_RECEPT_2026_VADASZ
        const _0x_S = "TITKOS_RECEPT_2026_VADASZ"; 

        let deviceID = localStorage.getItem('labda_device_id');
        let isActivated = localStorage.getItem('labda_activated') === 'true';

        if (!deviceID) {
            deviceID = 'ID-' + Math.random().toString(36).substr(2, 7).toUpperCase();
            localStorage.setItem('labda_device_id', deviceID);
        }
        document.getElementById('device-id-display').innerText = "AZONOSÍTÓ: " + deviceID;

        if (isActivated) {
            document.getElementById('activation-shield').style.display = 'none';
        }

        // Belső ellenőrző függvény (Ugyanaz, mint a Pythonban)
        function _0x_verify(did, inputCode) {
            let hash = 0;
            let combined = did + _0x_S;
            for (let i = 0; i < combined.length; i++) {
                hash = ((hash << 5) - hash) + combined.charCodeAt(i);
                hash |= 0; // 32-bit kényszerítés
            }
            let valid = "LABDA-" + Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
            return inputCode.toUpperCase() === valid;
        }

        function checkCode() {
            const input = document.getElementById('activation-input').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            if (_0x_verify(deviceID, input)) {
                localStorage.setItem('labda_activated', 'true');
                document.getElementById('activation-shield').style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
                setTimeout(() => { errorMsg.style.display = 'none'; }, 3000);
            }
        }

        // --- 2. PWA ÉS UI (Változatlan) ---
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            document.getElementById('install-panel').classList.add('visible');
        });

        async function pwaInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('install-panel').classList.remove('visible');
                deferredPrompt = null;
            }
        }

        function togglePanel() {
            document.getElementById('install-panel').classList.toggle('collapsed');
            document.getElementById('toggle-btn').innerText = document.getElementById('install-panel').classList.contains('collapsed') ? '›' : '‹';
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        // --- 3. FIZIKAI MOTOR ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const config = { gravity: 0.65, friction: 0.982, bounce: 0.78, kickForce: 32, ballRadius: 40 };
        let ball = { x: 100, y: 100, vx: 10, vy: 0, radius: config.ballRadius, color: '#e74c3c', isGlowing: false };

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function update() {
            if (localStorage.getItem('labda_activated') === 'true') {
                ball.vy += config.gravity;
                ball.vx *= config.friction; ball.vy *= config.friction;
                ball.x += ball.vx; ball.y += ball.vy;

                if (ball.y + ball.radius > canvas.height) { ball.y = canvas.height - ball.radius; ball.vy *= -config.bounce; }
                if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy *= -config.bounce; }
                if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.vx *= -config.bounce; }
                if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -config.bounce; }
            }
            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.isGlowing ? '#f1c40f' : '#e74c3c';
            ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#ecf0f1'; ctx.stroke(); ctx.closePath();
        }

        function handleInput(clientX, clientY) {
            const dx = clientX - ball.x; const dy = clientY - ball.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < ball.radius) {
                const angle = Math.atan2(dy, dx);
                ball.vx = -Math.cos(angle) * config.kickForce;
                ball.vy = -Math.sin(angle) * config.kickForce;
                ball.isGlowing = true; setTimeout(() => ball.isGlowing = false, 150);
            }
        }

        canvas.addEventListener('mousedown', (e) => handleInput(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => { handleInput(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });

        update();
    </script>
</body>
</html>
