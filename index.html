<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Titkos Fizikai Szimuláció v1.4</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LabdaApp">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            background-color: #34495e;
            cursor: crosshair;
        }

        /* UI elemek */
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #e74c3c;
            color: #ecf0f1;
            user-select: none;
            z-index: 10;
        }

        .title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e74c3c;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Teljes képernyő gomb */
        #fs-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(231, 76, 60, 0.6);
            color: white;
            border: 1px solid #e74c3c;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
            z-index: 100;
        }

        #fs-button:hover {
            background-color: rgba(231, 76, 60, 1);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="title">🔒 Labda Projekt v1.2</div>
        <div style="font-size: 0.8rem; color: #95a5a6; margin-top: 5px;">Mód: Fullscreen App Mode</div>
        <div style="font-size: 0.7rem; margin-top: 10px;">Interakció: Érintés vagy kattintás a labdán</div>
    </div>

    <button id="fs-button" onclick="toggleFullScreen()">TELJES KÉPERNYŐ</button>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // --- Fizikai állandók ---
        const config = {
            gravity: 0.65,
            friction: 0.982,
            bounce: 0.78,
            kickForce: 32,
            ballRadius: 40
        };

        let ball = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            vx: 10,
            vy: 0,
            radius: config.ballRadius,
            color: '#e74c3c',
            isGlowing: false
        };

        // --- Ablakkezelés ---
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Biztonsági fal-ellenőrzés
            if (ball.x + ball.radius > canvas.width) ball.x = canvas.width - ball.radius;
            if (ball.y + ball.radius > canvas.height) ball.y = canvas.height - ball.radius;
            if (ball.x - ball.radius < 0) ball.x = ball.radius;
            if (ball.y - ball.radius < 0) ball.y = ball.radius;
        }

        window.addEventListener('resize', resize);
        resize();

        // --- Teljes képernyő funkció ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Hiba a váltáskor: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // --- Fizikai számítások ---
        function update() {
            ball.vy += config.gravity;
            ball.vx *= config.friction;
            ball.vy *= config.friction;

            ball.x += ball.vx;
            ball.y += ball.vy;

            // Alsó fal (Padló)
            if (ball.y + ball.radius > canvas.height) {
                ball.y = canvas.height - ball.radius;
                ball.vy *= -config.bounce;
                if (Math.abs(ball.vy) < 1.2) ball.vy = 0;
            }
            
            // Felső fal (Plafon)
            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.vy *= -config.bounce;
            }

            // Jobb fal
            if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.vx *= -config.bounce;
            }

            // Bal fal
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx *= -config.bounce;
            }

            draw();
            requestAnimationFrame(update);
        }

        // --- Megjelenítés ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dinamikus árnyék
            const shadowSize = Math.max(10, ball.radius * (ball.y / canvas.height));
            const shadowOpacity = Math.max(0.1, 0.4 * (ball.y / canvas.height));
            
            ctx.beginPath();
            ctx.ellipse(ball.x, canvas.height - 5, shadowSize, 6, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0,0,0,${shadowOpacity})`;
            ctx.fill();
            ctx.closePath();

            // Labda teste
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            
            // Gradiens a térhatáshoz
            let gradient = ctx.createRadialGradient(
                ball.x - ball.radius/3, ball.y - ball.radius/3, ball.radius/10,
                ball.x, ball.y, ball.radius
            );
            gradient.addColorStop(0, ball.isGlowing ? '#f1c40f' : '#ff5e5e');
            gradient.addColorStop(1, ball.isGlowing ? '#d4ac0d' : '#c0392b');
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Keret
            ctx.lineWidth = 3;
            ctx.strokeStyle = ball.isGlowing ? '#ffffff' : '#ecf0f1';
            ctx.stroke();
            ctx.closePath();
        }

        // --- Interakció (Egér és Érintés) ---
        function handleInput(clientX, clientY) {
            const dx = clientX - ball.x;
            const dy = clientY - ball.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < ball.radius) {
                const angle = Math.atan2(dy, dx);
                ball.vx = -Math.cos(angle) * config.kickForce;
                ball.vy = -Math.sin(angle) * config.kickForce;
                
                ball.isGlowing = true;
                setTimeout(() => ball.isGlowing = false, 150);
            }
        }

        canvas.addEventListener('mousedown', (e) => handleInput(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            handleInput(e.touches[0].clientX, e.touches[0].clientY);
            e.preventDefault(); // Ne görgessen az oldal
        }, { passive: false });

        update();
    </script>
</body>
</html>
